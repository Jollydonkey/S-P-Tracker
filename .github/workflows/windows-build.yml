name: Windows build and validation

on:
  push:
    branches: [stable-3.4.1]
    paths-ignore:
      - stracker/stracker.exe
      - stracker/WINDOWS_BUILD.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.6.8"
          architecture: x64
      - name: Install pinned Windows build dependencies
        run: |
          python -m pip install pip==21.3.1 setuptools==58.0.4 wheel==0.37.1
          python -m pip install -r requirements-windows-build.txt
      - name: Verify custom reconnect and database fixes
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build Windows executable and resources
        run: python scripts/build_windows.py
      - name: Validate extracted executable and disposable database
        run: python scripts/verify_windows_package.py artifacts/stracker-3.4.1-windows-x64.zip
      - name: Record installed versions
        shell: pwsh
        run: python -m pip freeze --all | Out-File -Encoding utf8 artifacts/windows-build-environment.txt
      - name: Upload validated test build
        uses: actions/upload-artifact@v4
        with:
          name: stracker-3.4.1-windows-x64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
